<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coloring">
<meta name="theme-color" content="#5EC3E8">
<title>Little Colors</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --sky:#DFF4FF;
    --sky-deep:#5EC3E8;
    --paper:#FFFDF6;
    --ink:#2B2B33;
    --sun:#FFC93C;
    --coral:#FF6B6B;
    --leaf:#3CB878;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:-apple-system, "SF Pro Rounded", ui-rounded, "Segoe UI Rounded", system-ui, sans-serif;
    background:var(--sky);
    color:var(--ink);
    touch-action:none;
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden; }

  .sticker{
    border:none; border-radius:20px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    outline: 4px solid #fff; outline-offset:-4px;
    cursor:pointer; transition: transform .08s ease;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800;
  }
  .sticker:active{ transform: translateY(4px) scale(0.97); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }

  /* ================= HOME SCREEN ================= */
  #home{
    flex:1; display:flex; flex-direction:column; min-height:0;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px 16px;
  }
  .home-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex:0 0 auto; }
  .import-btn{
    background:var(--sky-deep); font-size:15px; height:52px; padding:0 18px; gap:8px;
  }
  .import-btn svg{ width:24px; height:24px; }
  .home-title{ font-size:22px; font-weight:900; color:#3A6EA5; }

  .carousel-wrap{ position:relative; flex:1; min-height:0; display:flex; align-items:center; }
  #carousel{
    flex:1; height:100%; display:flex; align-items:center; gap:16px;
    overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
    padding: 0 14%; touch-action:pan-x;
    scrollbar-width:none;
  }
  #carousel::-webkit-scrollbar{ display:none; }
  .page-card{
    flex:0 0 72%; height:92%; max-height:100%; scroll-snap-align:center;
    background:var(--paper); border-radius:28px; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:10px; box-shadow:0 6px 0 rgba(0,0,0,0.1);
  }
  .page-card .art{ width:82%; height:78%; position:relative; }
  .page-card .art .strokes-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .page-card .art .outline-img, .page-card .art .outline-svg{ position:absolute; inset:0; width:100%; height:100%; mix-blend-mode:multiply; pointer-events:none; }
  .page-card .art .outline-svg svg{ width:100%; height:100%; display:block; }
  .page-card .name{ font-size:17px; font-weight:800; margin-top:4px; }
  .page-card .dot{ position:absolute; top:12px; right:12px; width:14px; height:14px; border-radius:50%; background:var(--leaf); box-shadow:0 0 0 3px #fff; display:none; z-index:2; }
  .page-card.has-progress .dot{ display:block; }
  .page-card .del{
    position:absolute; top:8px; left:8px; width:34px; height:34px; border-radius:50%;
    background:var(--coral); color:#fff; font-weight:900; font-size:16px; border:3px solid #fff;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 0 rgba(0,0,0,.2); z-index:2;
  }

  .nav-arrow{
    position:absolute; top:50%; transform:translateY(-50%); width:52px; height:52px;
    background:rgba(94,195,232,0.92); font-size:22px; border-radius:50%; z-index:3;
  }
  .nav-arrow.prev{ left:2px; }
  .nav-arrow.next{ right:2px; }

  .dots{ flex:0 0 auto; display:flex; justify-content:center; gap:8px; padding-top:8px; }
  .dots .d{ width:9px; height:9px; border-radius:50%; background:#B9D9EA; }
  .dots .d.active{ background:var(--sky-deep); width:22px; border-radius:6px; }
  .version-tag{
    position:absolute; bottom:8px; right:12px;
    font-size:11px; color:#B9D9EA; font-weight:700;
    pointer-events:none; z-index:5; user-select:none;
  }

  /* ================= DRAW SCREEN ================= */
  #draw{ position:fixed; inset:0; display:none; flex-direction:column; background:var(--sky); }
  #draw.active{ display:flex; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: max(8px, env(safe-area-inset-top)) 12px 6px 12px; gap:10px; flex:0 0 auto;
    position:relative; z-index:10; background:var(--sky);
  }
  .exit-btn{ background:var(--coral); font-size:16px; padding:12px 20px; height:52px; }
  .zoom-controls{ display:flex; gap:10px; align-items:center; }
  .zoom-btn{ background:var(--sky-deep); font-size:24px; width:52px; height:52px; }
  .right-controls{ display:flex; gap:10px; align-items:center; }
  .undo-btn{ background:#8791A8; font-size:14px; padding:12px 18px; height:52px; }
  .undo-btn.disabled{ opacity:0.4; pointer-events:none; }
  .clear-btn{ background:#6C757D; font-size:14px; padding:12px 18px; height:52px; }

  .main-row{ flex:1; display:flex; flex-direction:row; min-height:0; gap:0; padding:0; }

  .draw-container{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }

  .side-dock{
    flex:0 0 auto; width:140px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; padding:8px 0;
    position:relative; z-index:10; background:var(--sky);
  }

  .canvas-wrap{ flex:1; min-width:0; display:flex; align-items:center; justify-content:center; padding:0; min-height:0; width:100%; }
  #canvasFrame{
    position:relative; background:var(--paper);
    border-radius:20px; box-shadow:0 8px 0 rgba(0,0,0,0.12);
    touch-action:none; overflow:hidden;
  }
  #canvasFrame canvas, #canvasFrame img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #outlineImg{ pointer-events:none; mix-blend-mode:multiply; }

  .color-row{
    flex:0 0 auto; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:nowrap;
    padding: 8px 12px max(8px, env(safe-area-inset-bottom)) 12px;
    background:var(--paper); border-top-left-radius:24px; border-top-right-radius:24px; overflow-x:auto;
    position:relative; z-index:10;
  }

  .tool-btn{ width:128px; height:128px; background:#8791A8; padding:16px; flex:0 0 auto; border-radius:32px; }
  .tool-btn svg{ width:76px; height:76px; }
  .tool-btn.selected{ background:var(--sky-deep); outline-color:var(--sun); transform:scale(1.05); }

  .shape-btn{ width:128px; height:128px; font-size:48px; background:#8791A8; flex:0 0 auto; border-radius:32px; }
  .shape-btn.selected{ background:var(--sun); }

  .color-swatch{ width:96px; height:96px; border-radius:50%; box-shadow:0 6px 0 rgba(0,0,0,.18); outline:6px solid #fff; outline-offset:-6px; }
  .color-swatch.selected{ outline-color:var(--ink); transform:scale(1.12); }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,20,30,0.45); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal-card{ background:var(--paper); border-radius:26px; padding:26px 22px; max-width:340px; text-align:center; box-shadow:0 10px 0 rgba(0,0,0,.15); }
  .modal-card p{ font-size:19px; font-weight:800; margin:0 0 18px 0; }
  .modal-actions{ display:flex; gap:14px; justify-content:center; }
  .modal-actions .sticker{ height:54px; padding:0 24px; font-size:16px; }
  .btn-yes{ background:var(--coral); }
  .btn-no{ background:var(--leaf); }
</style>
</head>
<body>
<div id="app">

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="home-header">
      <button class="sticker import-btn" id="importBtn">
        <svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="16" y="8" width="68" height="84" rx="8"/>
          <line x1="50" y1="36" x2="50" y2="70"/>
          <line x1="32" y1="53" x2="50" y2="36"/>
          <line x1="68" y1="53" x2="50" y2="36"/>
        </svg>
        Import
      </button>
      <div class="home-title">🎨 Little Colors</div>
    </div>

    <div class="carousel-wrap">
      <button class="sticker nav-arrow prev" id="prevBtn">‹</button>
      <div id="carousel"></div>
      <button class="sticker nav-arrow next" id="nextBtn">›</button>
    </div>
    <div class="dots" id="dots"></div>

    <input type="file" id="pdfInput" accept="application/pdf,image/png,image/jpeg,image/jpg,image/webp" multiple style="display:none;">
    <div class="version-tag">v1.2</div>
  </div>

      <button class="sticker exit-btn" id="exitBtn">← Exit</button>

        <button class="sticker zoom-btn" id="zoomInBtn">+</button>
      </div>
      <div class="right-controls">
        <button class="sticker undo-btn disabled" id="undoBtn" title="Undo">↺ Undo</button>
        <button class="sticker clear-btn" id="clearBtn">🧽 Wipe clean</button>
      </div>
    </div>

    <div class="main-row">
      <div class="draw-container">
        <div class="canvas-wrap">
          <div id="canvasFrame">
            <canvas id="drawCanvas"></canvas>
            <img id="outlineImg" alt="">
          </div>
        </div>
        <div class="color-row" id="colorRow"></div>
      </div>

      <div class="side-dock right" id="toolsDock">

          <svg viewBox="0 0 512 446.201" xmlns="http://www.w3.org/2000/svg"><g fill-rule="nonzero"><path d="M121.683 218.8c-2.858-2.857-2.629-7.723.512-10.864 3.14-3.141 8.007-3.37 10.864-.512l174.464 174.467c2.857 2.857 2.628 7.724-.513 10.865-3.141 3.14-8.007 3.369-10.864.512L121.683 218.8z"/><path d="M304.071 407.141l-179.668 38.621c-7.248 1.536-14.411-1.059-19.04-6.192l-83.521-83.944c-30.268-30.425-28.351-42.165 1.249-71.674L297.755 10.135c12.341-14.197 37.43-13.072 49.401.83l151.95 152.417c16.511 16.57 17.726 36.066.38 53.365L314.024 401.733a19.918 19.918 0 01-9.958 5.387l.005.021z"/><path fill="#E3504D" d="M299.918 387.549l-179.669 38.622-95.182-95.668c-5.677-5.677-5.677-14.598 0-20.274l287.08-286.195c5.185-5.86 14.445-5.353 19.791 0l155.611 156.092c5.679 5.68 5.676 14.591 0 20.274L299.918 387.549z"/><path fill="#AF413F" d="M309.168 378.299l-22.609-20.198 186.884-192.123 14.106 14.148c5.16 5.396 6.421 11.826 0 20.274L309.168 378.299z"/><path d="M475.163 446.111c-5.544 0-10.041-4.941-10.041-11.034 0-6.094 4.497-11.034 10.041-11.034h18.919c5.544 0 10.04 4.94 10.04 11.034 0 6.093-4.496 11.034-10.04 11.034h-18.919zm-173.12-38.535l-76.601 16.467h217.962c5.545 0 10.041 4.94 10.041 11.034 0 6.093-4.496 11.034-10.041 11.034h-321.28c-6.447.614-12.619-1.948-16.761-6.541l-89.724-90.179c-20.295-20.398-20.555-37.615.185-58.164l92.631-91.796c7.78-7.738 20.331-7.753 28.133-.077l177.357 173.933c7.877 7.746 7.981 20.413.235 28.29-3.734 3.794-7.341 4.969-12.137 5.999z"/><path fill="#E4E5E5" d="M299.918 387.549l-179.669 38.622-95.182-95.668c-5.677-5.677-5.677-14.598 0-20.274l97.496-96.614 177.355 173.934z"/></g></svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* ---------- Animal outline library disabled — custom imported pages only ---------- */
const OUTLINES = {};
const ANIMALS = [];

const COLORS = [
  {name:"Red", v:"#E63946"}, {name:"Orange", v:"#F3722C"}, {name:"Yellow", v:"#F9C74F"},
  {name:"Green", v:"#43AA8B"}, {name:"Blue", v:"#1F75FE"}, {name:"Purple", v:"#9B5DE5"},
  {name:"Brown", v:"#8D5A44"}, {name:"Black", v:"#22222A"}
];

/* ---------- Storage helpers ---------- */
const store = {
  get(k, fallback){ try{ const v = localStorage.getItem(k); return v===null ? fallback : JSON.parse(v);}catch(e){return fallback;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.warn("Storage full or unavailable", e); } }
};
const strokesKey = id => `lc_strokes_${id}`;
const CUSTOM_KEY = "lc_custom_pages";

/* ---------- App state ---------- */
let currentPageId = null;
let currentTool = "brush";
let currentShape = "star";
let currentColor = COLORS[0].v;
let drawing = false;
let lastPt = null;
let lastStampPt = null;
let lastDabPt = null;
let undoStack = [];
const UNDO_MAX = 15;

const drawCanvas = document.getElementById("drawCanvas");
const ctx = drawCanvas.getContext("2d");
const outlineImg = document.getElementById("outlineImg");
const canvasFrame = document.getElementById("canvasFrame");
const carousel = document.getElementById("carousel");

function hasProgress(id){ return !!store.get(strokesKey(id), null); }

function allPages(){
  const custom = store.get(CUSTOM_KEY, []);
  return custom.map(p => ({id:p.id, name:p.name, custom:true, outline:p.outline}));
}

/* ---------- Home carousel rendering (loops infinitely via lead/trail clones) ---------- */
let lcPages = [];

function buildCard(p, isClone){
  const card = document.createElement("div");
  card.className = "page-card" + (hasProgress(p.id) ? " has-progress" : "");
  card.dataset.id = p.id;
  const savedStrokes = hasProgress(p.id) ? store.get(strokesKey(p.id)) : null;
  const outlineHtml = p.custom
    ? `<img class="outline-img" src="${p.outline}" alt="">`
    : `<div class="outline-svg">${OUTLINES[p.id]}</div>`;
  card.innerHTML = `
    ${(p.custom && !isClone) ? '<button class="del">✕</button>' : ''}
    <div class="dot"></div>
    <div class="art">
      ${savedStrokes ? `<img class="strokes-img" src="${savedStrokes}" alt="">` : ''}
      ${outlineHtml}
    </div>
    <div class="name">${p.name}</div>
  `;
  card.addEventListener("pointerup", (e)=>{
    if (e.target.closest(".del")) return;
    openPage(p);
  });
  if (p.custom && !isClone){
    card.querySelector(".del").addEventListener("pointerup", (e)=>{
      e.stopPropagation();
      openDeleteModal(p.id);
    });
  }
  return card;
}

function renderHome(scrollToId){
  lcPages = allPages();
  carousel.innerHTML = "";
  const dotsEl = document.getElementById("dots");
  dotsEl.innerHTML = "";

  if (lcPages.length === 0) {
    const emptyCard = document.createElement("div");
    emptyCard.className = "page-card";
    emptyCard.style.cursor = "pointer";
    emptyCard.innerHTML = `
      <div style="font-size:64px; margin-bottom:12px;">➕</div>
      <div class="name" style="font-size:24px;">Import a Coloring Page</div>
      <p style="font-size:15px; color:#666; margin-top:6px;">Tap here to add a PDF or Image</p>
    `;
    emptyCard.addEventListener("pointerup", () => {
      document.getElementById("pdfInput").click();
    });
    carousel.appendChild(emptyCard);
    return;
  }

  const loop = lcPages.length > 1;
  if (loop) carousel.appendChild(buildCard(lcPages[lcPages.length - 1], true));
  lcPages.forEach(p => carousel.appendChild(buildCard(p, false)));
  if (loop) carousel.appendChild(buildCard(lcPages[0], true));

  lcPages.forEach(()=>{
    const dot = document.createElement("div");
    dot.className = "d";
    dotsEl.appendChild(dot);
  });

  requestAnimationFrame(()=>{
    let targetIndex = loop ? 1 : 0;
    if (scrollToId){
      const idx = lcPages.findIndex(p=>p.id===scrollToId);
      if (idx>=0) targetIndex = loop ? idx+1 : idx;
    }
    const cards = carousel.querySelectorAll(".page-card");
    if (cards[targetIndex]) cards[targetIndex].scrollIntoView({behavior:"instant", inline:"center", block:"nearest"});
    updateDots();
  });
}

function cardStep(){
  const first = carousel.querySelector(".page-card");
  if (!first) return 0;
  const style = getComputedStyle(carousel);
  const gap = parseFloat(style.columnGap || style.gap || 16);
  return first.getBoundingClientRect().width + gap;
}

function updateDots(){
  const step = cardStep();
  if (!step || !lcPages.length) return;
  const loop = lcPages.length > 1;
  const rawIdx = Math.round(carousel.scrollLeft / step);
  let realIdx = loop ? rawIdx - 1 : rawIdx;
  if (realIdx < 0) realIdx = lcPages.length - 1;
  if (realIdx > lcPages.length - 1) realIdx = 0;
  document.querySelectorAll(".dots .d").forEach((d,i)=> d.classList.toggle("active", i===realIdx));

  if (loop){
    if (rawIdx === 0){
      carousel.scrollLeft = Math.round(lcPages.length * step);
    } else if (rawIdx === lcPages.length + 1){
      carousel.scrollLeft = Math.round(1 * step);
    }
  }
}
carousel.addEventListener("scroll", ()=>{
  window.clearTimeout(carousel._t);
  carousel._t = window.setTimeout(updateDots, 60);
});

document.getElementById("prevBtn").addEventListener("pointerup", ()=>{
  carousel.scrollBy({left: -cardStep(), behavior:"smooth"});
});
document.getElementById("nextBtn").addEventListener("pointerup", ()=>{
  carousel.scrollBy({left: cardStep(), behavior:"smooth"});
});

/* ---------- Toolbar rendering ---------- */
function renderColors(){
  const row = document.getElementById("colorRow");
  row.innerHTML = "";
  COLORS.forEach((c,i)=>{
    const b = document.createElement("button");
    b.className = "sticker color-swatch" + (i===0 ? " selected":"");
    b.style.background = c.v;
    b.title = c.name;
    b.addEventListener("pointerup", ()=>{
      currentColor = c.v;
      document.querySelectorAll(".color-swatch").forEach(el=>el.classList.remove("selected"));
      b.classList.add("selected");
    });
    row.appendChild(b);
  });
}

let currentZoom = 1;

const zoomIn = document.getElementById("zoomInBtn");
const zoomOut = document.getElementById("zoomOutBtn");

if (zoomIn) {
  zoomIn.addEventListener("pointerup", ()=>{
    currentZoom = Math.min(2.0, currentZoom + 0.15);
    applyZoom();
  });
}
if (zoomOut) {
  zoomOut.addEventListener("pointerup", ()=>{
    currentZoom = Math.max(0.6, currentZoom - 0.15);
    applyZoom();
  });
}

function applyZoom(){
  if (canvasFrame) {
    canvasFrame.style.transform = `scale(${currentZoom})`;
    canvasFrame.style.transformOrigin = "center center";
  }
}

document.querySelectorAll("#toolsDock .tool-btn").forEach(b=>{
  b.addEventListener("pointerup", ()=>{
    currentTool = b.dataset.tool;
    if (currentTool === "stamp"){
      document.getElementById("toolsDock").style.display = "none";
      document.getElementById("shapesDock").style.display = "flex";
    } else {
      document.querySelectorAll("#toolsDock .tool-btn").forEach(el=>el.classList.remove("selected"));
      b.classList.add("selected");
    }
  });
});

document.querySelectorAll("#shapesDock .shape-btn").forEach(b=>{
  b.addEventListener("pointerup", ()=>{
    currentShape = b.dataset.shape;
    document.getElementById("shapesDock").style.display = "none";
    document.getElementById("toolsDock").style.display = "flex";
    document.querySelectorAll("#toolsDock .tool-btn").forEach(el=>el.classList.remove("selected"));
    const stampBtn = document.querySelector('#toolsDock [data-tool="stamp"]');
    if (stampBtn) stampBtn.classList.add("selected");
  });
});

/* ---------- Canvas sizing ---------- */
function sizeCanvasFrame(){
  const wrap = document.querySelector(".canvas-wrap");
  const wW = wrap.clientWidth;
  const wH = wrap.clientHeight;
  const targetRatio = 4/3;
  let w = wW, h = w/targetRatio;
  if (h > wH){ h = wH; w = h*targetRatio; }
  canvasFrame.style.width = w+"px";
  canvasFrame.style.height = h+"px";

  const prevW = drawCanvas.width, prevH = drawCanvas.height;
  const snapshot = (prevW && prevH) ? ctx.getImageData(0,0,prevW,prevH) : null;
  const dpr = window.devicePixelRatio || 1;
  drawCanvas.width = Math.round(w*dpr);
  drawCanvas.height = Math.round(h*dpr);
  ctx.setTransform(1,0,0,1,0,0);
  if (snapshot){
    const tmp = document.createElement("canvas");
    tmp.width = prevW; tmp.height = prevH;
    tmp.getContext("2d").putImageData(snapshot,0,0);
    ctx.drawImage(tmp, 0,0, drawCanvas.width, drawCanvas.height);
  }
}
window.addEventListener("resize", ()=>{ if(currentPageId) sizeCanvasFrame(); });

/* ---------- Open / exit a page ---------- */
let outlineRetryTimer = null;

function loadOutlineWithRetry(src){
  let retried = false;
  clearTimeout(outlineRetryTimer);

  function forceReload(){
    if (retried) return;
    retried = true;
    // Kept as a defensive fallback for genuine transient load failures.
    // Reassigning the exact same src value is often silently ignored by
    // the browser, so clear it first to force a real reload attempt.
    outlineImg.src = "";
    requestAnimationFrame(() => {
      outlineImg.src = src;
    });
  }

  outlineImg.onerror = forceReload;
  outlineImg.src = src;
  outlineRetryTimer = setTimeout(() => {
    if (!retried && !outlineImg.complete){
      forceReload();
    }
  }, 700);
}

function openPage(page){
  currentPageId = page.id;
  currentZoom = 1;
  applyZoom();
  undoStack = [];
  updateUndoBtnState();
  document.getElementById("home").style.display = "none";
  document.getElementById("draw").classList.add("active");

  loadOutlineWithRetry(page.custom ? page.outline : ("data:image/svg+xml;utf8," + encodeURIComponent(OUTLINES[page.id])));

  sizeCanvasFrame();

  const saved = store.get(strokesKey(page.id), null);
  ctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  if (saved){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img, 0,0, drawCanvas.width, drawCanvas.height); };
    img.src = saved;
  }
}

function saveProgress(){
  if (!currentPageId) return;
  try{ store.set(strokesKey(currentPageId), drawCanvas.toDataURL("image/png")); }
  catch(e){ console.warn("Could not save progress", e); }
}

function updateUndoBtnState(){
  document.getElementById("undoBtn").classList.toggle("disabled", undoStack.length === 0);
}

function pushUndoSnapshot(){
  try{
    undoStack.push(drawCanvas.toDataURL("image/png"));
    if (undoStack.length > UNDO_MAX) undoStack.shift();
    updateUndoBtnState();
  }catch(e){ console.warn("Could not capture undo snapshot", e); }
}

function performUndo(){
  if (undoStack.length === 0) return;
  const prev = undoStack.pop();
  const img = new Image();
  img.onload = ()=>{
    ctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    ctx.drawImage(img, 0,0, drawCanvas.width, drawCanvas.height);
    saveProgress();
    updateUndoBtnState();
  };
  img.src = prev;
}
document.getElementById("undoBtn").addEventListener("pointerup", performUndo);

document.getElementById("exitBtn").addEventListener("pointerup", ()=>{
  saveProgress();
  document.getElementById("draw").classList.remove("active");
  document.getElementById("home").style.display = "flex";
  const lastId = currentPageId;
  currentPageId = null;
  renderHome(lastId);
});

/* ---------- Clear page ---------- */
document.getElementById("clearBtn").addEventListener("pointerup", ()=>{
  document.getElementById("clearModal").classList.add("show");
});
document.getElementById("cancelClear").addEventListener("pointerup", ()=>{
  document.getElementById("clearModal").classList.remove("show");
});
document.getElementById("confirmClear").addEventListener("pointerup", ()=>{
  pushUndoSnapshot();
  ctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  saveProgress();
  document.getElementById("clearModal").classList.remove("show");
});
document.getElementById("clearModal").addEventListener("pointerup", (e)=>{
  if (e.target.id === "clearModal") {
    document.getElementById("clearModal").classList.remove("show");
  }
});

/* ---------- Drawing engine ---------- */
function getPoint(evt){
  const rect = drawCanvas.getBoundingClientRect();
  const t = evt.touches ? evt.touches[0] : evt;
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  return { x:(t.clientX-rect.left)*scaleX, y:(t.clientY-rect.top)*scaleY };
}

const TOOL_WIDTH = { brush:92, marker:52, crayon:24 };
const TOOL_OPACITY = { brush:0.92, marker:1.0, crayon:0.88 };
const TOOL_MIXWEIGHT = { brush:0.5, marker:0.55, crayon:0.55 };

function hexToRgb(hex){
  const v = parseInt(hex.slice(1),16);
  return [(v>>16)&255, (v>>8)&255, v&255];
}

/* Paints one round "dab": where the canvas already has paint, blend the new
   color into what's there (so red over blue makes purple, like real paint);
   where it's blank, lay the new color down at the tool's normal opacity.
   Stamping dabs along the path (instead of one continuous ctx.stroke per
   mousemove segment) avoids the dark overlap blotches you get from drawing
   lots of small translucent strokes that cross back over each other. */
function paintDab(cx, cy, radius, rgb, opacity, mixWeight){
  const x0 = Math.max(0, Math.floor(cx-radius));
  const y0 = Math.max(0, Math.floor(cy-radius));
  const x1 = Math.min(drawCanvas.width, Math.ceil(cx+radius));
  const y1 = Math.min(drawCanvas.height, Math.ceil(cy+radius));
  const w = x1-x0, h = y1-y0;
  if (w<=0||h<=0) return;
  const imgData = ctx.getImageData(x0,y0,w,h);
  const data = imgData.data;
  const r2 = radius*radius;
  const nr=rgb[0], ng=rgb[1], nb=rgb[2];
  const newAlpha = Math.round(255*opacity);
  for(let yy=0; yy<h; yy++){
    const dy = (y0+yy+0.5) - cy;
    const dy2 = dy*dy;
    const rowBase = yy*w;
    for(let xx=0; xx<w; xx++){
      const dx = (x0+xx+0.5) - cx;
      if (dx*dx+dy2 > r2) continue;
      const idx = (rowBase+xx)*4;
      const a = data[idx+3];
      if (a > 10){
        data[idx]   = (data[idx]  *(1-mixWeight) + nr*mixWeight) | 0;
        data[idx+1] = (data[idx+1]*(1-mixWeight) + ng*mixWeight) | 0;
        data[idx+2] = (data[idx+2]*(1-mixWeight) + nb*mixWeight) | 0;
        data[idx+3] = 255;
      } else {
        data[idx]=nr; data[idx+1]=ng; data[idx+2]=nb; data[idx+3]=newAlpha;
      }
    }
  }
  ctx.putImageData(imgData, x0, y0);
}

function paintTexture(cx,cy,radius,rgb,mixW){
  for(let i=0;i<2;i++){
    const jx=(Math.random()-0.5)*radius*0.6, jy=(Math.random()-0.5)*radius*0.6;
    paintDab(cx+jx, cy+jy, radius*0.5, rgb, 0.4, mixW*0.6);
  }
}

function paintAlongSegment(p0, p1, tool){
  const radius = TOOL_WIDTH[tool]/2;
  const rgb = hexToRgb(currentColor);
  const opacity = TOOL_OPACITY[tool];
  const mixW = TOOL_MIXWEIGHT[tool];
  const spacing = Math.max(radius*0.35, 3);

  if (!lastDabPt){
    paintDab(p1.x, p1.y, radius, rgb, opacity, mixW);
    if (tool === "crayon") paintTexture(p1.x,p1.y,radius,rgb,mixW);
    lastDabPt = {x:p1.x, y:p1.y};
    return;
  }
  let dx = p1.x-lastDabPt.x, dy = p1.y-lastDabPt.y;
  let dist = Math.hypot(dx,dy);
  while (dist >= spacing){
    const t = spacing/dist;
    const nx = lastDabPt.x + dx*t, ny = lastDabPt.y + dy*t;
    paintDab(nx, ny, radius, rgb, opacity, mixW);
    if (tool === "crayon") paintTexture(nx,ny,radius,rgb,mixW);
    lastDabPt = {x:nx, y:ny};
    dx = p1.x-lastDabPt.x; dy = p1.y-lastDabPt.y;
    dist = Math.hypot(dx,dy);
  }
}

function eraseSegment(p0,p1){
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.globalCompositeOperation = "destination-out";
  ctx.lineWidth = 50;
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
  ctx.globalCompositeOperation = "source-over";
}

function drawShape(cx, cy, shape, size, color){
  ctx.fillStyle = color; ctx.strokeStyle = color;
  ctx.beginPath();
  if (shape === "circle"){
    ctx.arc(cx,cy,size/2,0,Math.PI*2); ctx.fill();
  } else if (shape === "star"){
    const spikes=5, outer=size/2, inner=size/4.2;
    let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
    ctx.moveTo(cx, cy-outer);
    for(let i=0;i<spikes;i++){
      x = cx + Math.cos(rot)*outer; y = cy + Math.sin(rot)*outer;
      ctx.lineTo(x,y); rot+=step;
      x = cx + Math.cos(rot)*inner; y = cy + Math.sin(rot)*inner;
      ctx.lineTo(x,y); rot+=step;
    }
    ctx.closePath(); ctx.fill();
  } else if (shape === "triangle"){
    const s = size/2;
    ctx.moveTo(cx, cy-s); ctx.lineTo(cx+s, cy+s); ctx.lineTo(cx-s, cy+s);
    ctx.closePath(); ctx.fill();
  } else if (shape === "heart"){
    const s = size/2;
    ctx.moveTo(cx, cy+s*0.8);
    ctx.bezierCurveTo(cx-s*1.3, cy-s*0.3, cx-s*0.5, cy-s*1.2, cx, cy-s*0.35);
    ctx.bezierCurveTo(cx+s*0.5, cy-s*1.2, cx+s*1.3, cy-s*0.3, cx, cy+s*0.8);
    ctx.closePath(); ctx.fill();
  }
}

let activePointerId = null;

function handleStart(evt){
  if (activePointerId !== null && evt.pointerId !== activePointerId) return;
  activePointerId = evt.pointerId;
  evt.preventDefault();
  drawing = true;
  pushUndoSnapshot();
  const p = getPoint(evt);
  lastPt = p;
  lastDabPt = null;
  if (currentTool === "stamp"){
    const scale = drawCanvas.width/800;
    drawShape(p.x, p.y, currentShape, 90*Math.max(scale,0.5), currentColor);
    lastStampPt = p;
  } else if (currentTool === "eraser"){
    eraseSegment(p,p);
  } else {
    paintAlongSegment(p,p,currentTool);
  }
}
function handleMove(evt){
  if (!drawing || evt.pointerId !== activePointerId) return;
  evt.preventDefault();
  const p = getPoint(evt);
  if (currentTool === "stamp"){
    const dist = Math.hypot(p.x-lastStampPt.x, p.y-lastStampPt.y);
    const scale = drawCanvas.width/800;
    const spacing = 90*Math.max(scale,0.5);
    if (dist > spacing){
      drawShape(p.x, p.y, currentShape, 90*Math.max(scale,0.5), currentColor);
      lastStampPt = p;
    }
  } else if (currentTool === "eraser"){
    eraseSegment(lastPt, p);
    lastPt = p;
  } else {
    paintAlongSegment(lastPt, p, currentTool);
    lastPt = p;
  }
}
function handleEnd(evt){
  if (!drawing || (evt && evt.pointerId !== activePointerId)) return;
  drawing = false; lastPt = null; lastStampPt = null; lastDabPt = null;
  activePointerId = null;
  saveProgress();
}

canvasFrame.addEventListener("pointerdown", handleStart);
canvasFrame.addEventListener("pointermove", handleMove);
window.addEventListener("pointerup", handleEnd);
window.addEventListener("pointercancel", handleEnd);

document.addEventListener("visibilitychange", ()=>{ if(document.hidden) saveProgress(); });

/* ---------- PDF import ---------- */
document.getElementById("importBtn").addEventListener("pointerup", ()=>{
  document.getElementById("pdfInput").click();
});
async function fileToOutlineData(file){
  if (file.type === "application/pdf"){
    if (!window.pdfjsLib){
      throw new Error("PDF reader not available");
    }
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({scale: 2});
    const tmp = document.createElement("canvas");
    tmp.width = viewport.width; tmp.height = viewport.height;
    await page.render({canvasContext: tmp.getContext("2d"), viewport}).promise;
    return tmp.toDataURL("image/png");
  } else if (file.type.startsWith("image/")){
    const rawDataUrl = await new Promise((res, rej)=>{
      const reader = new FileReader();
      reader.onload = ()=>res(reader.result);
      reader.onerror = rej;
      reader.readAsDataURL(file);
    });
    const img = await new Promise((res, rej)=>{
      const im = new Image();
      im.onload = ()=>res(im);
      im.onerror = rej;
      im.src = rawDataUrl;
    });
    const maxDim = 1400;
    let w = img.width, h = img.height;
    if (w > maxDim || h > maxDim){
      const scale = maxDim / Math.max(w,h);
      w = Math.round(w*scale); h = Math.round(h*scale);
    }
    const tmp = document.createElement("canvas");
    tmp.width = w; tmp.height = h;
    tmp.getContext("2d").drawImage(img, 0, 0, w, h);
    return tmp.toDataURL("image/png");
  } else {
    throw new Error("Unsupported file type: " + file.type);
  }
}

document.getElementById("pdfInput").addEventListener("change", async (e)=>{
  const files = Array.from(e.target.files || []);
  if (!files.length) return;

  const importBtn = document.getElementById("importBtn");
  const isBulk = files.length > 1;
  if (isBulk){
    importBtn.style.pointerEvents = "none";
    importBtn.style.opacity = "0.6";
  }

  const imported = [];
  let failCount = 0;

  for (const file of files){
    try{
      const outlineData = await fileToOutlineData(file);
      const id = "page_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
      const name = file.name.replace(/\.[^.]+$/,"").slice(0,20) || "Imported";
      imported.push({id, name, outline: outlineData, createdAt: Date.now(), custom: true});
    }catch(err){
      console.error(err);
      failCount++;
    }
  }

  if (imported.length){
    const list = store.get(CUSTOM_KEY, []);
    list.push(...imported);
    store.set(CUSTOM_KEY, list);
  }

  e.target.value = "";
  if (isBulk){
    importBtn.style.pointerEvents = "";
    importBtn.style.opacity = "";
  }

  if (!imported.length){
    alert("That file couldn't be opened. Please choose a PDF or image coloring page.");
    return;
  }
  if (failCount){
    alert(`${imported.length} page${imported.length===1?'':'s'} imported. ${failCount} file${failCount===1?'':'s'} couldn't be opened.`);
  }

  if (imported.length === 1 && !failCount){
    openPage(imported[0]);
  } else {
    renderHome(imported[0].id);
  }
});

/* ---------- Delete Modal & Parent Gate ---------- */
let pendingDeleteId = null;
let currentMathAnswer = 0;

function closeDeleteModal(){
  document.getElementById("deleteModal").classList.remove("show");
  document.getElementById("deleteErrorMsg").style.display = "none";
  pendingDeleteId = null;
}

function openDeleteModal(pageId){
  pendingDeleteId = pageId;
  const num1 = Math.floor(Math.random() * 8) + 3;
  const num2 = Math.floor(Math.random() * 8) + 3;
  currentMathAnswer = num1 + num2;
  document.getElementById("deleteGateText").textContent = `Adult Gate: What is ${num1} + ${num2}?`;
  document.getElementById("deleteMathAnswer").value = "";
  document.getElementById("deleteErrorMsg").style.display = "none";
  document.getElementById("deleteModal").classList.add("show");
}

/* Close modal when clicking backdrop outside card */
document.getElementById("deleteModal").addEventListener("pointerup", (e)=>{
  if (e.target.id === "deleteModal") {
    closeDeleteModal();
  }
});

document.getElementById("cancelDelete").addEventListener("pointerup", closeDeleteModal);

document.getElementById("confirmDelete").addEventListener("pointerup", ()=>{
  const input = parseInt(document.getElementById("deleteMathAnswer").value, 10);
  if (input === currentMathAnswer){
    if (pendingDeleteId){
      const updated = store.get(CUSTOM_KEY, []).filter(x=>x.id!==pendingDeleteId);
      store.set(CUSTOM_KEY, updated);
      localStorage.removeItem(strokesKey(pendingDeleteId));
      renderHome();
    }
    closeDeleteModal();
  } else {
    document.getElementById("deleteErrorMsg").style.display = "block";
    document.getElementById("deleteMathAnswer").value = "";
    document.getElementById("deleteMathAnswer").focus();
  }
});
